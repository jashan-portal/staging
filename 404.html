    <script>
  (function () {
    var segmentCount = 0;
    var l = window.location;
    var repoRoot = l.pathname.split("/").slice(0, 1 + segmentCount).join("/") + "/";
    var pathAfterRoot = l.pathname.split("/").slice(1 + segmentCount).join("/");
    var redirect =
      repoRoot +
      "?/" +
      pathAfterRoot +
      (l.search ? "&" + l.search.slice(1) : "") +
      l.hash;

    l.replace(redirect);
  })();
</script>
